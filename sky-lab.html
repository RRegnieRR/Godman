<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Planetary sky studio</title>
<style>body{margin:0;background:#05070d;color:#edf2f7;font:14px system-ui}canvas{display:block}aside{position:absolute;z-index:1;left:20px;top:20px;width:245px;padding:18px;background:#101820e8;border:1px solid #ffffff25;border-radius:10px}h1{font-size:19px;margin:0 0 8px}p{color:#b9c5d2;line-height:1.5}label{display:block;margin:12px 0 5px}select,input{box-sizing:border-box;width:100%}select,button{background:#293844;color:#fff;border:1px solid #ffffff35;border-radius:5px;padding:8px}button{cursor:pointer}.times{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}a{color:#9cd7ff}output{display:block;font-size:12px;color:#cad5e0;margin-top:12px}input[type=checkbox]{width:auto}#status{position:absolute;bottom:16px;left:20px;color:#d0dae5;text-shadow:0 1px 3px #000}aside.hidden>:not(#toggle){display:none}aside.hidden{width:auto;padding:8px}#toggle{float:right;margin-left:8px}@media(max-width:600px){aside{left:8px;top:8px;width:205px;padding:12px}aside p{display:none}h1{font-size:16px}}</style></head><body>
<aside><button id="toggle">Hide</button><h1>Planetary skies</h1><p>The same sky and cloud renderer used in the game. Drag to look around.</p>
<label for="body">World</label><select id="body"><option>Earth</option><option>Mars</option><option>Venus</option><option>Titan</option><option>Moon</option><option>Mercury</option><option>Neptune</option></select>
<label for="elevation">Sun elevation <span id="angle">45°</span></label><input id="elevation" type="range" min="-90" max="90" step="1" value="45">
<div class="times"><button data-sun="45">Day</button><button data-sun="0">Sunset</button><button data-sun="-10">Twilight</button><button data-sun="-40">Night</button></div>
<label for="altitude">Altitude <span id="height">0 km</span></label><input id="altitude" type="range" min="0" max="200" step="0.05" value="0">
<label><input type="checkbox" id="clouds" checked> Clouds</label><output id="description"></output><p><a href="index.html?build=20261109.34.4">Open game</a></p></aside><div id="status">Loading sky…</div>
<script src="vendor/three.r128.min.js"></script><script src="src/runtime/physical-lighting.js?v=20261109.40"></script><script src="src/runtime/planetary-sky.js?v=20261109.37"></script>
<script>
(function(){
 const T=THREE,scene=new T.Scene();scene.background=new T.Color(0x01040b);
 const camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,1e23);camera.position.set(0,2,0);
 const renderer=new T.WebGLRenderer({antialias:true,logarithmicDepthBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.outputEncoding=T.sRGBEncoding;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;document.body.appendChild(renderer.domElement);
 const sunMesh=new T.Mesh(new T.SphereGeometry(6.96e7,24,16),new T.MeshBasicMaterial({color:0xfff5dc,toneMapped:false}));scene.add(sunMesh);
 const sky=new GodmanPlanetarySky(T,scene,renderer.capabilities.isWebGL2||renderer.extensions.has('EXT_frag_depth')),ambient=new T.HemisphereLight(0xb6d5ff,0x484537,.5),light=new T.DirectionalLight(0xfff2df,1);scene.add(ambient,light);
 const ground=new T.Mesh(new T.PlaneGeometry(12000,12000),new T.MeshStandardMaterial({color:0x8e9e7c,roughness:1}));ground.rotation.x=-Math.PI/2;scene.add(ground);
 const earthTexture=new T.TextureLoader().load('assets/earth/earth_day_2048.jpg');earthTexture.encoding=T.sRGBEncoding;
 const globe=new T.Mesh(new T.SphereGeometry(1,256,128),new T.MeshStandardMaterial({color:0xffffff,map:earthTexture,roughness:1}));scene.add(globe);
 const objects=new T.Group();scene.add(objects);for(let i=0;i<12;i++){const m=new T.Mesh(new T.ConeGeometry(100+i*13,130+i*25,7),new T.MeshStandardMaterial({color:0x687b79,roughness:1}));m.position.set((i-5.5)*230,55+i*8,-1300-(i%3)*190);objects.add(m);}
 const stone=new T.Mesh(new T.BoxGeometry(2,2,2),new T.MeshStandardMaterial({color:0xb0b2af,roughness:1}));stone.position.set(3,1,-10);objects.add(stone);
 let seed=39;const rand=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};const pts=[];for(let i=0;i<2800;i++){const y=rand()*2-1,a=rand()*Math.PI*2,r=Math.sqrt(1-y*y);pts.push(Math.cos(a)*r*80000,y*80000,Math.sin(a)*r*80000);}
 const stars=new T.Points(new T.BufferGeometry().setAttribute('position',new T.Float32BufferAttribute(pts,3)),new T.PointsMaterial({color:0xdbe6ff,size:220,sizeAttenuation:true,transparent:true,depthWrite:false}));scene.add(stars);
 const worlds={Earth:[637100,0x6db3ff,1],Mars:[339000,0xd8a080,1.52],Venus:[605200,0xe8c87a,.723],Titan:[257470,0xd58c3b,9.58],Moon:[173700,null,1],Mercury:[244000,null,.387],Neptune:[2462200,0x4a78ea,30.1]};
 let body,observer=new T.Vector3(),star={center:new T.Vector3(),temperature:5772,luminosity:1},yaw=0,pitch=.14,clock=new T.Clock(),elapsed=0;
 const world=document.getElementById('body'),elevation=document.getElementById('elevation'),altitude=document.getElementById('altitude');
 const explanations={Earth:'Blue molecular scattering, white water clouds, and warm sunsets.',Mars:'Dusty amber daylight, a blue sunset aureole, and thin ice clouds.',Venus:'Dense yellow haze beneath an overcast cloud deck.',Titan:'Orange aerosol haze and methane cloud cover.',Moon:'No substantial atmosphere: black sky even in sunlight.',Mercury:'Airless sky: no blue scattering or clouds.',Neptune:'Blue atmospheric haze and bright cloud tops.'};
 function select(){const p=worlds[world.value];body={name:world.value,r:p[0],atmosphere:p[1],center:new T.Vector3(0,-p[0],0),mesh:new T.Object3D()};ground.material.color.setHex(world.value==='Mars'?0xa76845:world.value==='Moon'||world.value==='Mercury'?0x777777:0x8e9e7c);globe.material.map=world.value==='Earth'?earthTexture:null;globe.material.color.setHex(world.value==='Earth'?0xffffff:world.value==='Mars'?0xa76845:0x999999);globe.material.needsUpdate=true;document.getElementById('description').textContent=explanations[world.value];}
 world.onchange=select;select();
 document.querySelectorAll('[data-sun]').forEach(b=>b.onclick=()=>{elevation.value=b.dataset.sun;});document.getElementById('toggle').onclick=e=>{const hidden=e.target.parentElement.classList.toggle('hidden');e.target.textContent=hidden?'Show':'Hide';};
 let drag=false,x,y;renderer.domElement.onpointerdown=e=>{drag=true;x=e.clientX;y=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);};renderer.domElement.onpointerup=()=>drag=false;renderer.domElement.onpointermove=e=>{if(drag){yaw-=(e.clientX-x)*.005;pitch=T.MathUtils.clamp(pitch+(e.clientY-y)*.004,-1.4,1.4);x=e.clientX;y=e.clientY;}};
 addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
 function frame(){requestAnimationFrame(frame);elapsed+=Math.min(.05,clock.getDelta());const a=Number(elevation.value)*Math.PI/180,h=Number(altitude.value);observer.set(0,h*100,0);const distance=worlds[world.value][2]*1.496e10;star.center.set(Math.sin(.35)*Math.cos(a)*distance,Math.sin(a)*distance,-Math.cos(.35)*Math.cos(a)*distance);sunMesh.position.copy(star.center).sub(observer);sunMesh.material.color.set(0xfff5dc).lerp(new T.Color(0xff6935),Math.exp(-Math.pow(Math.sin(a)*6,2)));camera.lookAt(Math.sin(yaw)*Math.cos(pitch),2+Math.sin(pitch),-Math.cos(yaw)*Math.cos(pitch));const state=sky.update(camera,body,observer,star,elapsed);for(const layer of sky.layers)layer.visible=layer.visible&&document.getElementById('clouds').checked;stars.material.opacity=state.starVisibility;globe.position.copy(body.center).sub(observer);globe.scale.setScalar(body.r);globe.visible=h>5;ground.position.y=-h*100;objects.position.y=-h*100;ground.visible=objects.visible=h<50;light.position.copy(star.center).normalize();light.intensity=Math.max(0,Math.sin(a))*1.2;ambient.intensity=.015+state.skyFactor*.65;ambient.color.setHex(body.atmosphere||0xffffff);renderer.toneMappingExposure=Math.min(1.32,.9*Math.pow(worlds[world.value][2],.15));document.getElementById('angle').textContent=elevation.value+'°';document.getElementById('height').textContent=h+' km';document.getElementById('status').textContent=world.value+' · '+(!state.enabled?'Space / airless sky':state.daylight>.8?'Daylight':state.daylight>.02?'Twilight':'Night')+' · '+h+' km';renderer.render(scene,camera);}
 frame();
})();
</script></body></html>
