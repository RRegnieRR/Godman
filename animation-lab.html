<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Suit motion studio</title>
<style>
body{margin:0;background:#171c22;color:#ece6dc;font:14px system-ui}canvas{display:block}aside{position:absolute;left:22px;top:20px;width:265px;max-height:calc(100vh - 80px);overflow:auto;background:#171b20ed;padding:20px;border:1px solid #ffffff24;border-radius:8px}h1{font-size:20px;margin:0 0 8px}p{line-height:1.5;color:#b4bac0}label{display:block;margin-top:12px}button,select,input[type=number]{background:#333b44;color:#fff;border:1px solid #ffffff30;border-radius:4px;padding:8px;margin:5px 0}select,input{width:100%;box-sizing:border-box}button{cursor:pointer}output{display:block;margin:10px 0;color:#e6b78f;line-height:1.4}a{color:#e6b78f}.row{display:flex;gap:8px}#loading{position:absolute;right:24px;top:24px;font-size:12px;pointer-events:none}details{margin-top:9px;font-size:12px}summary{cursor:pointer;color:#e6b78f}#rateValue{float:right;color:#d6d9dd}
@media(max-width:700px){aside{left:8px;top:8px;width:230px;padding:10px;max-height:55vh}aside p{display:none}aside h1{font-size:14px}aside select{padding:4px}aside button{padding:5px;font-size:11px}aside label{font-size:11px;margin-top:5px}aside output{font-size:11px;margin:6px 0}aside a{font-size:11px}#loading{top:auto;bottom:10px;right:10px;font-size:10px}}
aside.collapsed{width:auto;padding:8px}aside.collapsed>:not(#toggleControls){display:none!important}
</style></head><body>
<aside><button id="toggleControls" aria-expanded="true">Hide controls</button><h1>Suit motion studio</h1><p>The same motion controller and model used in the game. Drag the scene to orbit.</p>
<label for="pose">Movement</label><select id="pose">
<option value="idle">Idle / breathing</option><option value="walk">Walk · 1.8 m/s</option><option value="run">Run · 4.4 m/s</option><option value="transitions">Walk → run → stop</option><option value="charge">Charge / planted crouch</option><option value="jump">Launch sequence</option><option value="land">Landing sequence</option><option value="fall">Atmospheric fall</option><option value="coast">Weightless coast</option><option value="hover">Repulsor hover</option><option value="cruise">Repulsor cruise</option><option value="turn">Bank / steering</option><option value="reverse">Flight direction reversals</option><option value="brake">Air brake</option><option value="swim">Swimming</option><option value="sourcewalk">Original authored walk · comparison</option></select>
<div class="row"><button id="replay">Replay</button><button id="pause">Pause</button><button id="front">Front</button><button id="side">Side</button></div>
<label for="scrub">Sequence time</label><input id="scrub" type="range" min="0" max="4" step="0.01" value="0">
<output id="status">Loading suit…</output>
<details id="playbackControls"><summary>Playback controls</summary>
<label for="seek">Inspect time (seconds)</label><input id="seek" type="number" min="0" max="4" step="0.01" value="0">
<label for="rate">Playback speed <span id="rateValue">1×</span></label><input id="rate" type="range" min="0.1" max="1" step="0.1" value="1">
</details>
<details id="flightControls"><summary>Live flight steering</summary>
<label for="flightYaw">Heading</label><input id="flightYaw" type="range" min="-180" max="180" step="5" value="0">
<label for="flightPitch">Thrust tilt</label><input id="flightPitch" type="range" min="-60" max="80" step="5" value="0">
<label for="flightPower">Throttle</label><input id="flightPower" type="range" min="0" max="1" step="0.05" value="1">
</details>
<a href="index.html?build=20261104.31.2">Open game</a>
</aside><div id="loading">Loading model…</div>
<script src="vendor/three.r128.min.js"></script><script src="vendor/loaders/GLTFLoader.r128.js"></script>
<script src="src/runtime/launch-sequence.js?v=20261104.31.2"></script>

<script src="src/data/athletic-run.js?v=20261103.2"></script>
<script src="src/data/walk-motion.js?v=20261102.5"></script>
<script src="src/runtime/running-gait.js?v=20261103.2"></script>
<script src="src/runtime/character-controller.js?v=20261104.31.2"></script>
<script src="src/runtime/propulsor-rig.js?v=20261104.31.2"></script>
<script src="src/runtime/flight-dynamics.js?v=20261104.31.2"></script>
<script src="src/runtime/animation-lab.js?v=20261111.59"></script>
</body></html>
